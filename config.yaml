# config.yaml

# General settings for the experiment runner
experiment_settings:
  csv_file_path: "conversation.csv"
  log_file_path: "results.csv"
  output_dir: "output"

# Configuration profile for the Diffuser model
diffuser:
  api_url: "http://127.0.0.1:8000/generate_diff"
  # Default parameters for the Diffuser
  parameters:
    steps: 30
    canvas_size: 512
    negative_prompt: "signature, watermark, blurry, low quality, color"
    #negative_prompt: " "
    # The {description} placeholder will be filled by the runner
    positive_magic: "Style: sketch, simple background"
    prompt_templates:
      #initial: "Create a sketch image. Your sketch should highlight the things described in the description pictorially. Do not add any additional detail. Keep the sketch simple. Here is the first person point of view description - '{description}'\n{positive_magic}"
      # initial: >
      #   Create an image where every object is created using only dashed outlines. Have big spaces between each dashes.
      #   The image is from a first person point of view who is present in the visitor services area of a zoo.
      #   The view also has a first aid station.
      #   Main focus in the image is on the visitor services area and the first aid station next to it. Hence make their outlines solid.
      #   Do not color anything unless specified for an object.
      #   Do not add any additional detail.
      #   Keep the image simple.
      # initial: >
      #   A first person point-of-view image of a visitor services area of a zoo. There is also a first-aid station.
      #   Every object is created using only dotted outlines. Have big spaces between each dot.
      #   Main focus in the image is on the visitor services area and the first aid station next to it. So make only their outlines solid and nothing else.
      #   Do not color anything unless specified for an object.
      #   Do not add any additional detail.
      #   Keep the image simple.
      # modify: "Modify the existing scene from a first-person point-of-view, incorporating this new detail: '{description}'\n{positive_magic}"
      # u1: "Add a map board directly on a brick wall. Make it's outline solid."
      # u2: "Add a red carpet below the image"
      # u3: "Remove the map and place it to the right of the carpet right next to it on a board"
      # u4: "Change the carpet color to blue."
      # u5: "Add an emergency exit with a button near an exit sign. Only add their solid outlines and no color."
      initial: >
        A first person point-of-view image of a house with a road infront.
        Everything is created using only dotted outlines. Have very big spaces between each dot.
        Main focus in the image is the house.
        Make the house's outlines solid.
        Do not color anything in the image. Keep everything white unless asked.
        Do not add any additional detail than what has been asked.
        Keep the image simple.

# Configuration profile for the SGP (SVG) model
sgp:
  api_url: "http://12.0.0.1:8001/generate_svg"
  # URL for the new text refining endpoint
  refiner_api_url: "http://127.0.0.1:8001/refine_description"
  # Default parameters for the SGP model
  parameters:
    canvas_size: 512 # Used for rendering the final PNG
    # The {description} and {previous_svg} placeholders will be filled by the runner
    prompt_templates:
      initial: "Please write complete SVG code for an image corresponding to the following description: '{description}'"
      modify: "Here is existing SVG code:\n<svg_code>\n{previous_svg}\n</svg_code>\nPlease modify this SVG to incorporate the following new instruction: '{description}'. Output only the new, complete SVG code."

# Prompt for the text refiner model
refiner:
  prompt_template: >
    You are an expert scene descriptor. Your task is to read the following utterance from a single character's point of view and refine them into a single, clear, and descriptive paragraph.
    Instructions:
    1. Focus only on the physical environment, objects, and their spatial relationships.
    2. Ignore conversational filler, greetings, and questions.
    3. Combine related details into a coherent scene.
    4. Output only the descriptive paragraph.

    Conversation Snippets:
    """
    {dialogue_lines}
    """

    Refine Scene Description: