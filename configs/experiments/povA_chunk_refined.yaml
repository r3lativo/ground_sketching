experiment_name: "povA_chunk_refined_v1"
description: "Generates a single image for chunk 001 from Character A's POV, using the cinematic refiner."

# --- Data Source ---
csv_file_path: "data/conversation.csv"
chunk_id: "001"
character: "Nathan"

# --- Generation Logic ---
mode: "chunk"

# --- Prompt Refinement Settings ---
refine_prompt: true  # Set to true to enable the server-side refiner
refiner_template_name: "cinematic_description" # Matches the .jinja2 filename

# --- Model & Server ---
# The API endpoint must now point to /generate
api_url: "http://localhost:8000/generate"

# Default generation parameters for the image model
parameters:
  initial_num_steps: 50      # Steps for the very first image
  num_inference_steps: 30    # Steps for all subsequent images
  canvas_size: 1024
  negative_prompt: "text, watermark, signature, blurry, low-quality"
  true_cfg_scale: 4.5 # Example of a model-specific parameter

# --- Output ---
output_dir: "results/"
log_file_path: "results/experiment_log.csv"