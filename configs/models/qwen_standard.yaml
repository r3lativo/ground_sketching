# Configuration for the original Qwen Image Edit model
preset_name: "Qwen-Image-Edit-Standard"

# Hugging Face model identifier
model_id: "Qwen/Qwen-Image-Edit"

# Python class names for dynamic loading from libraries (e.g., diffusers, transformers)
pipeline_class: "diffusers.QwenImageEditPipeline"
transformer_class: "diffusers.QwenImageTransformer2DModel"
text_encoder_class: "transformers.Qwen2_5_VLForConditionalGeneration"

# Subfolders within the Hugging Face repository where components are stored
transformer_subfolder: "transformer"
text_encoder_subfolder: "text_encoder"