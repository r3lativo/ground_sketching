# config/server_config.yaml

image_gen_service:
  host: "0.0.0.0"
  port: 8002
  model_id: "Qwen/Qwen-Image-Edit-2509"
  lora_path: "Qwen-Image-Lightning/Qwen-Image-Edit-2509/Qwen-Image-Edit-2509-Lightning-8steps-V1.0-fp32.safetensors"

image_gen_client:
  seed: 0
  num_inference_steps: 8
  true_cfg_scale: 4.0
  negative_prompt: " "

prompt_polisher_service:
  host: "0.0.0.0"
  port: 8001
  model_id: "/lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-VL-32B-Instruct"
  seed: 0
  gpu_memory_utilization: 0.9
  tensor_parallel_size: 1
  dtype: "bfloat16"
  trust_remote_code: true
  max_model_len: 15000

prompt_polisher_client:
  seed: 0
  top_p: 0.9
  temperature: 0.7
  max_tokens: 5000
  jinja_env: 'config'  # The fodler where jinja files are
  polish_template: 'polish.jinja2'
  edit_template: 'polish_edit.jinja2'
  contextual_polish_template: 'contextual_polish.jinja2'
  contextual_edit_template: 'contextual_polish_edit.jinja2'